server:
  port: 8082

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/inventory_db
    username: ${POSTGRES_USER:flashsale}
    password: ${POSTGRES_PASSWORD:flashsale}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

clients:
  catalog:
    base-url: ${CATALOG_BASE_URL:http://localhost:8081}
  payment:
    base-url: ${PAYMENT_BASE_URL:http://localhost:8083}

inventory:
  reserve-ttl-seconds: 600
  outbox:
    poll-interval-ms: 1000
  expiry:
    poll-interval-ms: 5000
    cutoff-seconds: 540

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
