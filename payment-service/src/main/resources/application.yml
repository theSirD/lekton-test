server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/payment_db
    username: ${POSTGRES_USER:flashsale}
    password: ${POSTGRES_PASSWORD:flashsale}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

payment:
  default-outcome: SUCCESS

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
